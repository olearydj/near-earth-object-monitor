[project]
name = "near-earth-object-monitor"
version = "0.3.0"
description = "Command-line summary tool for NASA near-Earth object API data."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.13.4",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "rich>=15.0.0",
]

[project.scripts]
neo-monitor = "neo_monitor.cli:main"
neo = "neo_monitor.cli:main"

[build-system]
requires = ["uv_build>=0.11.25,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "neo_monitor"

[dependency-groups]
dev = [
    "mypy>=1.16",
    "pytest>=8.4",
    "pytest-cov>=7.1.0",
    "ruff>=0.12",
]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
