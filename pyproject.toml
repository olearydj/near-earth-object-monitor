[project]
name = "near-earth-object-monitor"
version = "0.4.0"
description = "CLI and dashboard for NASA near-Earth object API data."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.13.4",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "rich>=15.0.0",
    "streamlit>=1.59.1",
]

[project.scripts]
neo-monitor = "neo_monitor.cli:main"
neo = "neo_monitor.cli:main"

[build-system]
requires = ["uv_build>=0.11.25,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "neo_monitor"

[dependency-groups]
dev = [
    "mypy>=1.16",
    "pytest>=8.4",
    "pytest-cov>=7.1.0",
    "ruff>=0.12",
]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["streamlit", "streamlit.*"]
follow_imports = "skip"
